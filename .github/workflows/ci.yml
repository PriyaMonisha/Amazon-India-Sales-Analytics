name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amazon_sales
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: sudo apt-get install -y libgomp1 build-essential

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements/ci.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install grpcio binary (feast dependency — avoids slow C++ compilation)
        run: pip install --upgrade pip && pip install grpcio --only-binary=grpcio

      - name: Install project dependencies
        run: pip install -r requirements/ci.txt

      - name: Lint
        run: ruff check src/ api/ tests/

      - name: Run tests
        env:
          FAST_MODE: "true"
          APP_ENV: "local"
          AMAZON_DB_URL: "postgresql+psycopg2://postgres:postgres@localhost:5432/amazon_sales"
          API_KEY: "ci-test-key-not-for-production"
        run: pytest tests/ -x -q --tb=short
