name: amazon-sales

services:

  # ── PostgreSQL (data warehouse) ──────────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: amazon_postgres
    environment:
      POSTGRES_DB: amazon_sales
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"   # 5433 on host to avoid conflict with local PostgreSQL on 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d amazon_sales"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 2g
    restart: unless-stopped

  # ── Redis (feature store online layer) ────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: amazon_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    mem_limit: 512m
    restart: unless-stopped

  # ── MinIO (local S3 — artifact store + MLflow backend) ────────────────────
  minio:
    image: minio/minio:latest
    container_name: amazon_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    mem_limit: 1g
    restart: unless-stopped

  # ── MinIO bucket initialisation (runs once, then exits) ────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: amazon_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/amazon-sales --ignore-existing;
      mc mb local/mlflow-artifacts --ignore-existing;
      echo 'MinIO buckets ready.';
      exit 0;"
    restart: "no"

  # ── MLflow (experiment tracking) ─────────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: amazon_mlflow
    command: >
      mlflow server
      --backend-store-uri postgresql+psycopg2://postgres:postgres@postgres:5432/mlflow
      --default-artifact-root s3://amazon-sales/mlflow-artifacts
      --host 0.0.0.0
      --port 5000
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    mem_limit: 512m
    restart: unless-stopped

  # ── FastAPI (model serving) ───────────────────────────────────────────────
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: amazon_fastapi
    environment:
      APP_ENV: docker
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    mem_limit: 3g
    restart: unless-stopped

  # ── Streamlit (dashboard) ─────────────────────────────────────────────────
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: amazon_streamlit
    environment:
      APP_ENV: docker
      FASTAPI_HOST: fastapi
      FASTAPI_PORT: "8000"
    ports:
      - "8501:8501"
    depends_on:
      fastapi:
        condition: service_healthy
    mem_limit: 1g
    restart: unless-stopped

  # ── Prometheus (metrics collection) ──────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: amazon_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
    mem_limit: 512m
    restart: unless-stopped

  # ── Grafana (dashboards) ──────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: amazon_grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/provisioning/dashboards:/var/lib/grafana/dashboards
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    mem_limit: 512m
    restart: unless-stopped

  # ── Airflow DB + user initialisation (runs once, then exits) ─────────────
  airflow-init:
    image: apache/airflow:2.8.0
    container_name: amazon_airflow_init
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ./dags:/opt/airflow/dags
    command: >
      bash -c "
      airflow db init &&
      airflow users create
        --username admin
        --firstname Admin
        --lastname User
        --role Admin
        --email admin@example.com
        --password admin
      && echo 'Airflow initialised.'"
    restart: "no"

  # ── Airflow webserver ─────────────────────────────────────────────────────
  airflow-webserver:
    image: apache/airflow:2.8.0
    container_name: amazon_airflow_web
    command: webserver
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW_CONN_POSTGRES_DEFAULT: postgresql+psycopg2://postgres:postgres@postgres:5432/amazon_sales
      AMAZON_DB_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/amazon_sales
      APP_ENV: airflow
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
    mem_limit: 1g
    restart: unless-stopped

  # ── Airflow scheduler ─────────────────────────────────────────────────────
  airflow-scheduler:
    image: apache/airflow:2.8.0
    container_name: amazon_airflow_scheduler
    command: scheduler
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW_CONN_POSTGRES_DEFAULT: postgresql+psycopg2://postgres:postgres@postgres:5432/amazon_sales
      AMAZON_DB_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/amazon_sales
      APP_ENV: airflow
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
    mem_limit: 4g
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  grafana_data:
