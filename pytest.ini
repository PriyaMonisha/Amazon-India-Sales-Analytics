[pytest]
testpaths = tests
python_files = test_*.py
pythonpath = tests
asyncio_mode = none
addopts = --tb=short -q
markers =
    etl: ETL pipeline tests
    api: FastAPI endpoint tests
    models: ML model unit tests
    integration: tests requiring real services (skip with -m "not integration")
filterwarnings =
    ignore::DeprecationWarning:prophet
    ignore::FutureWarning:sklearn
    ignore::UserWarning:xgboost
    error::RuntimeWarning
    ignore::RuntimeWarning:numpy
    ignore::RuntimeWarning:sklearn
    ignore::RuntimeWarning:xgboost
log_cli = true
log_cli_level = WARNING
